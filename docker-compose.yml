x-app: &app
  build: .
  environment:
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: 12345
    KEYCLOAK_CLIENT_SECRET: client-secret
    KEYCLOAK_INTERNAL_URL: http://keycloack:8080
    KEYCLOAK_BROWSER_URL: http://localhost:8084
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres
    hostname: db
    container_name: postgres_app
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  auth-api-1:
    container_name: auth-api-1
    <<: *app
    ports:
      - "8080:8080"
  auth-api-2:
    container_name: auth-api-2
    <<: *app
    ports:
      - "8081:8080"
  auth-api-3:
    container_name: auth-api-3
    <<: *app
    ports:
      - "8082:8080"
  app:
    container_name: app
    build: C:\Users\Vinicius\Documents\Spring_exercicios\app\app
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: 12345
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx
    container_name: nginx-proxy
    depends_on:
      - auth-api-1
      - auth-api-2
      - auth-api-3
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro      
  auth_db:	
    image: postgres
    hostname: auth_db
    container_name: keycloack_auth_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak_pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  keycloack:
    build: ./keycloak/build/.
    command: start --optimized
    environment:
      KC_HOSTNAME: http://localhost:8084
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: 12345
      KC_DB_URL: jdbc:postgresql://auth_db:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 12345
    ports:
      - "8084:8080"
      - "8443:8443"
      - "9000:9000"
    depends_on:
      auth_db:
        condition: service_healthy
volumes:	
  keycloak_pgdata: