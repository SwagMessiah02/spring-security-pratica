x-app: &app
  build: .
  environment:
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: 12345
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres
    hostname: db
    container_name: postgres_app
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  app1:
    <<: *app
    ports:
      - "8080:8080"
  app2:
    <<: *app
    ports:
      - "8081:8080"
  app3:
    <<: *app
    ports:
      - "8082:8080"
  nginx:
    image: nginx
    depends_on:
      - app1
      - app2
      - app3
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro      