events {}

http {
    upstream backend {
        server auth-api-1:8080;
        server auth-api-2:8080;
        server auth-api-3:8080;
    }

    upstream app-backend {
        server app:8080;
    }

    server {
        listen 80;

        location = /auth/validate {
            return 404;
        }
        
        location /pratice-0.0.1-SNAPSHOT/ {
            proxy_pass http://backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        location /auth/ {
            proxy_pass http://backend/pratice-0.0.1-SNAPSHOT/;

            proxy_set_header Host               $host;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Port   $server_port;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /auth;

            proxy_cookie_path /pratice-0.0.1-SNAPSHOT /;
        }

        location /api/ {
            auth_request /_auth/validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;

            proxy_set_header X-Remote-User $auth_user;
            proxy_set_header Host $host;

            proxy_pass http://app-backend/app-0.0.1-SNAPSHOT/app/;
        }

        location = /_auth/validate {
            internal;

            proxy_pass http://backend/pratice-0.0.1-SNAPSHOT/validate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}