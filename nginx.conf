events {}

http {
    upstream backend {
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    upstream app-backend {
        server app-protected:8080;
    }

    server {
        listen 80;

        location /auth/ {
            proxy_set_header Host $host;
            proxy_pass http://backend/pratice-0.0.1-SNAPSHOT/;
        }

        location = /auth/validate {
            return 404;
        }
	
        location /api/ {
            auth_request /_auth/validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;

            proxy_set_header X-Remote-User $auth_user;
            proxy_set_header Host $host;

            proxy_pass http://app-backend/app-0.0.1-SNAPSHOT/app/;
        }

        location = /_auth/validate {
            internal;

            proxy_pass http://backend/pratice-0.0.1-SNAPSHOT/validate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}